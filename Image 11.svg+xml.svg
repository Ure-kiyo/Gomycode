<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&amp;family=Space+Grotesk:wght@600;700&amp;display=swap');
      .brand-title { font-family: 'Space Grotesk', 'Plus Jakarta Sans', sans-serif; font-weight: 700; }
      .brand-desc { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; fill: #64748B; font-weight: 500; }
      .label { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0B0F19" rx="24"/>
  <rect x="2" y="2" width="796" height="596" rx="22" stroke="#1E293B" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(48, 48)">
    <text x="0" y="0" fill="#F8FAFC" class="brand-title" font-size="24">Sift Brand Identity Explorations</text>
    <text x="0" y="24" class="brand-desc">Concept: Visualizing refinement, distillation &amp; thoughtful precision without cliché AI tropes.</text>
  </g>

  <!-- 4 Exploration Cards Grid -->
  <!-- Concept 1: The Funnel Tittle (Negative Space 'i') -->
  <g transform="translate(48, 110)">
    <rect width="336" height="200" rx="16" fill="#131B2E" stroke="#1E293B" stroke-width="1.5"/>
    <text x="24" y="32" fill="#818CF8" class="label">Direction 01 • Typographic Mark</text>
    <text x="24" y="52" fill="#E2E8F0" class="brand-title" font-size="16">The Distillation Wordmark</text>
    
    <!-- Visual Representation -->
    <g transform="translate(24, 75)">
      <!-- Custom Wordmark "Sift" where the 'i' dot is a tapered filter funnel and 'f-t' ligature creates a clean crossbar sieve -->
      <g transform="scale(1.15)">
        <!-- S -->
        <path d="M 32 38 C 30 32, 24 30, 16 30 C 7 30, 2 34, 2 41 C 2 48, 8 51, 19 54 C 33 58, 40 64, 40 73 C 40 84, 31 90, 18 90 C 7 90, 1 84, 0 76 L 9 74 C 10 80, 14 83, 19 83 C 26 83, 30 79, 30 73 C 30 67, 25 64, 13 60 C 2 56, -7 50, -7 41 C -7 31, 2 23, 16 23 C 27 23, 34 29, 35 37 Z" fill="#FFFFFF"/>
        <!-- i -->
        <rect x="46" y="39" width="9" height="50" rx="3" fill="#FFFFFF"/>
        <!-- Filter/Distill Tittle: Inverted conical pipette dropping the refined amber essence -->
        <path d="M 44 20 L 57 20 L 51.5 29 C 50.8 30.2, 49.2 30.2, 48.5 29 Z" fill="#4F46E5"/>
        <circle cx="50.5" cy="33.5" r="2.5" fill="#F59E0B"/>
        <!-- f -->
        <path d="M 72 23 C 65 23, 61 27, 61 35 L 61 39 L 55 39 L 55 46 L 61 46 L 61 89 L 70 89 L 70 46 L 82 46 L 82 39 L 70 39 L 70 34 C 70 31, 72 29, 75 29 C 78 29, 80 30, 81 31 L 84 25 C 81 23.5, 77 23, 72 23 Z" fill="#FFFFFF"/>
        <!-- t integrated with f crossbar -->
        <path d="M 91 32 L 91 39 L 85 39 L 85 46 L 91 46 L 91 75 C 91 85, 96 89, 105 89 C 109 89, 112 88, 114 86 L 112 79 C 110 80.5, 108 81, 105 81 C 101 81, 100 78, 100 73 L 100 46 L 110 46 L 110 39 L 100 39 L 100 32 Z" fill="#FFFFFF"/>
      </g>
    </g>
    <text x="24" y="180" class="brand-desc" font-size="11">Custom editorial logotype with architectural ligature and distillation tittle.</text>
  </g>

  <!-- Concept 2: The Horizon Sieve (Intersecting Concentric Filters) -->
  <g transform="translate(416, 110)">
    <rect width="336" height="200" rx="16" fill="#131B2E" stroke="#1E293B" stroke-width="1.5"/>
    <text x="24" y="32" fill="#818CF8" class="label">Direction 02 • Geometric Sieve</text>
    <text x="24" y="52" fill="#E2E8F0" class="brand-title" font-size="16">The Refinement Shutter</text>
    
    <!-- Mark: Nested converging geometric planes (Linear-level craft) -->
    <g transform="translate(30, 75)">
      <!-- Outer container square representing broad market -->
      <rect x="0" y="0" width="80" height="80" rx="20" fill="#1E1B4B" stroke="#312E81" stroke-width="2"/>
      <!-- Sieve bars that gracefully taper down in frequency and width -->
      <path d="M 18 24 L 62 24" stroke="#4F46E5" stroke-width="6" stroke-linecap="round"/>
      <path d="M 24 38 L 56 38" stroke="#6366F1" stroke-width="6" stroke-linecap="round"/>
      <path d="M 31 52 L 49 52" stroke="#A5B4FC" stroke-width="6" stroke-linecap="round"/>
      <!-- Selected single result dot -->
      <circle cx="40" cy="64" r="4.5" fill="#F59E0B"/>

      <!-- Paired Wordmark next to mark -->
      <text x="100" y="48" fill="#FFFFFF" class="brand-title" font-size="28" letter-spacing="-0.5px">Sift</text>
      <text x="101" y="66" fill="#64748B" font-family="'Plus Jakarta Sans'" font-size="11" font-weight="600" letter-spacing="0.05em">STUDIO CURATED</text>
    </g>
    <text x="24" y="180" class="brand-desc" font-size="11">Progressive aperture lines tapering to the singular optimal choice.</text>
  </g>

  <!-- Concept 3: The Monogram Funnel S -->
  <g transform="translate(48, 335)">
    <rect width="336" height="225" rx="16" fill="#131B2E" stroke="#1E293B" stroke-width="1.5"/>
    <text x="24" y="32" fill="#818CF8" class="label">Direction 03 • Monogram Hybrid</text>
    <text x="24" y="52" fill="#E2E8F0" class="brand-title" font-size="16">Continuous Contour 'S'</text>

    <!-- Visual -->
    <g transform="translate(30, 75)">
      <!-- Smooth single-stroke ribbon S whose upper basin catches and lower tail dispenses -->
      <svg width="80" height="80" viewBox="0 0 80 80">
        <rect width="80" height="80" rx="20" fill="#4F46E5"/>
        <path d="M 22 28 C 22 20, 58 20, 58 28 C 58 38, 24 40, 24 52 C 24 60, 56 60, 56 52" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
        <circle cx="56" cy="28" r="4" fill="#F59E0B"/>
      </svg>
      <g transform="translate(100, 20)">
        <text x="0" y="30" fill="#FFFFFF" class="brand-title" font-size="28" letter-spacing="-0.5px">Sift</text>
        <text x="1" y="48" fill="#94A3B8" font-family="'Plus Jakarta Sans'" font-size="11" font-weight="600">SMART SIFTING</text>
      </g>
    </g>
    <text x="24" y="195" class="brand-desc" font-size="11">Fluid ribbon 'S' embodying continuous intake, filter loop, and outcome.</text>
  </g>

  <!-- Concept 4: The Golden Mesh Prism (Arc / Notion precision) -->
  <g transform="translate(416, 335)">
    <rect width="336" height="225" rx="16" fill="#131B2E" stroke="#1E293B" stroke-width="1.5"/>
    <text x="24" y="32" fill="#818CF8" class="label">Direction 04 • Architectural Minimal</text>
    <text x="24" y="52" fill="#E2E8F0" class="brand-title" font-size="16">The Geometric Intersect</text>

    <!-- Visual -->
    <g transform="translate(30, 75)">
      <svg width="80" height="80" viewBox="0 0 80 80">
        <rect width="80" height="80" rx="20" fill="#030712" stroke="#3730A3" stroke-width="2"/>
        <!-- Two intersecting lens/sieve arcs that extract a golden leaf in the overlap -->
        <path d="M 22 56 A 34 34 0 0 1 56 22 A 34 34 0 0 1 22 56 Z" fill="#4F46E5" fill-opacity="0.5"/>
        <path d="M 28 58 A 34 34 0 0 0 58 28 A 34 34 0 0 0 28 58 Z" fill="#6366F1" fill-opacity="0.5"/>
        <path d="M 32 48 A 20 20 0 0 1 48 32 A 20 20 0 0 1 32 48 Z" fill="#F59E0B"/>
      </svg>
      <g transform="translate(100, 20)">
        <text x="0" y="30" fill="#FFFFFF" class="brand-title" font-size="28" letter-spacing="-0.5px">Sift</text>
        <text x="1" y="48" fill="#94A3B8" font-family="'Plus Jakarta Sans'" font-size="11" font-weight="600">PRODUCT DISCOVERY</text>
      </g>
    </g>
    <text x="24" y="195" class="brand-desc" font-size="11">Lens intersection extracting the pure essential choice from noisy sets.</text>
  </g>
</svg>